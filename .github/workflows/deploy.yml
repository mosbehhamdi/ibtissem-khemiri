name: Build, Test, Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run validate
      - run: npm run build
      - run: npm run validate # re-validates dist/ output

      - name: Install Playwright browser
        run: npx playwright install chromium

      - name: E2E smoke (production build, 3 viewports)
        run: |
          nohup npx vite preview --port 4173 --strictPort --host 127.0.0.1 > /tmp/preview.log 2>&1 &
          echo $! > /tmp/preview.pid
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:4173/ && break; sleep 2; done
          echo "--- preview.log ---"; cat /tmp/preview.log || true
          curl -sf -o /dev/null http://127.0.0.1:4173/
          E2E_BASE_URL=http://127.0.0.1:4173/ npm run test:e2e
          kill $(cat /tmp/preview.pid) || true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy-pages:
    needs: build-and-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
